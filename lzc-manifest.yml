application:
  subdomain: codetta
  multi_instance: false
  upstreams:
    - location: /
      backend: http://codetta:8111
  public_path:
    - /
services:
  codetta:
    # 镜像模式：Action 只读校验后把镜像改写/拷贝到懒猫仓库（official 商店要求 lazycat delivery）
    # upstream: ghcr.io/gavndev/codetta:0.15.0
    image: registry.lazycat.cloud/czyt/gavndev/codetta:0717decca004b119
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8111/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - PUID=1000
      - PGID=1000
    binds:
      # 音乐库：挂载懒猫用户家目录（应用内选择目录后读写音乐文件）
      - /lzcapp/run/mnt/home:/music
      # 配置（账号、预设、活动日志、搜索索引）
      - /lzcapp/var/codetta:/config
    tmpfs:
      - /tmp
usage: |
  Codetta 是自托管音乐库管理器：修复标签、在 MusicBrainz 匹配专辑与封面、
  整理文件目录、通过 slskd 导入新音乐。浏览器打开即可使用（含手机）。

  【挂载说明】
  应用把懒猫家目录挂载为音乐库（/music）。首次打开后注册管理员账号，
  在设置里选择家目录中的音乐文件夹即可开始整理。

  【可选集成】
  - Navidrome 等音乐服务器保存后即刻可见（或下次扫描时生效）
  - Soulseek 下载：需自行部署 slskd，并在设置中填入其地址与 API Key

  【数据】
  账号、预设、活动日志存于 /lzcapp/var/codetta，升级不丢。
